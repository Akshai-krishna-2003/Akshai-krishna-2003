<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 900 50'
    style='background-color: #00000000;'
    width='900px' height='50px'>

    <style>
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d1.end'
                    dur='6200ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h900 ; m0,25 h900 ; m0,25 h0' keyTimes='0;0.64516129032258;0.83870967741935;1' />
                    </path>
    <text font-family='"JetBrains Mono", monospace' fill='#94A3B8' font-size='18'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            I work on software systems.
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='6200ms' fill='remove'
                    values='m0,25 h0 ; m0,25 h900 ; m0,25 h900 ; m0,25 h0' keyTimes='0;0.64516129032258;0.83870967741935;1' />
                    </path>
    <text font-family='"JetBrains Mono", monospace' fill='#94A3B8' font-size='18'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Mostly mobile , backend work and AI and IOT.
        </textPath>
    </text>
</svg>
